name: Vérifications
on: [push, pull_request]
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier les signatures de collaboration
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [[ "$BASE_SHA" =~ ^0+$ || -z "$BASE_SHA" ]]; then
            range="$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          for commit in $(git rev-list "$range"); do
            git show -s --format=%B "$commit" | git interpret-trailers --parse | grep -Fxq 'Co-authored-by: Moon AI (https://chat.realmoon.ai)' || { echo "Missing trailer on $commit"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer la référence CPU
        run: python -m pip install -e './research[dev]'
      - name: Vérifier Rust
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable build --release --locked
      - name: Vérifier le moteur de référence
        run: |
          python -m ruff check research scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check research scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -v -s research/tests
      - name: Auto-tests des outils de mesure
        shell: pwsh
        run: |
          # The harness is what every perf claim rests on. Its self-tests need no game data.
          ./bench/heavy.ps1 -Mode SelfTest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./bench/capture.ps1 -Mode SelfTest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./bench/render-verify.ps1 -Mode SelfTest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
